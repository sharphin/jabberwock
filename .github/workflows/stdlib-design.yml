name: stdlib-design

on:
  push:
    branches: [main, stdlib-windows-design]
    paths:
      - 'docs/**'
      - 'scripts/stdlib_design.py'
      - '.github/workflows/stdlib-design.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/stdlib_design.py'
      - '.github/workflows/stdlib-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  declarations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registry, catalog, ownership and generated artifacts
        run: python scripts/stdlib_design.py
      - name: Check C declarations and layout assertions
        run: clang -std=c11 -Wall -Wextra -Werror -fsyntax-only -x c docs/stdlib-v1/stdlib-abi-v1.h
      - name: Check C++ declarations and layout assertions
        run: clang++ -std=c++11 -Wall -Wextra -Werror -fsyntax-only -x c++ docs/stdlib-v1/stdlib-abi-v1.h
