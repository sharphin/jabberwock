# ベンチマークの検査の数を見張る（bench/checks.sh）。時間はぶれるので見ず、
# 書き出した世代・添字の検査の数と、実行時に通った回数が bench/checks.txt より増えたら失敗にする
name: bench-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark check-count negative controls
        run: python3 -m unittest discover -s scripts -p test_bench_checks.py
      - name: clang の版
        run: clang --version
      - name: jabberwock を作る
        run: cargo build --release
      - name: 検査の数を比べる
        run: bench/checks.sh

  jwc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld
          rustc --version
          cargo --version
          clang++ --version
      - name: Compile and measure jwc against Rust / C++ (and Go when available)
        run: python scripts/benchmark_report.py --cases fib --runs 2
      - name: Retain benchmark diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jwc-benchmark-smoke
          path: target/benchmark-report.json
          if-no-files-found: warn
